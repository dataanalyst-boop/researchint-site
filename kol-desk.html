<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KOL Desk (Preview Revisi UAT)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* reset (setara skeleton artifact) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one working desk — top bar + tabs, content column; side drawer for KOL/deal detail (full-screen on phones). */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#18201d; --muted:#5d6863; --line:#dde2df; --soft:#eaeeeb;
  --accent:#0b6e5a; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --amber:#a15c00; --amber-bg:#fdf0d8; --blue:#1f4fa8; --blue-bg:#e2eafb; --red:#b3261e; --red-bg:#fbe3e1;
  --violet:#5b3fa3; --violet-bg:#ece6fa; --cyan:#0b6475; --cyan-bg:#dcf1f4; --green:#1d6b2f; --green-bg:#dff1e2; --grey:#5d6863; --grey-bg:#eceeed;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1a201e; --ink:#e7ece9; --muted:#9aa6a0; --line:#2b3330; --soft:#222a27;
  --accent:#4cc3a6; --accent-ink:#06231c; --accent-soft:#163a31;
  --amber:#f2b55c; --amber-bg:#3a2a10; --blue:#8fb1f5; --blue-bg:#1b2847; --red:#f19a92; --red-bg:#3e1a17;
  --violet:#bca7f0; --violet-bg:#2b2245; --cyan:#7fd2df; --cyan-bg:#12343a; --green:#8fd59d; --green-bg:#173521; --grey:#9aa6a0; --grey-bg:#252c29;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1a201e; --ink:#e7ece9; --muted:#9aa6a0; --line:#2b3330; --soft:#222a27;
  --accent:#4cc3a6; --accent-ink:#06231c; --accent-soft:#163a31;
  --amber:#f2b55c; --amber-bg:#3a2a10; --blue:#8fb1f5; --blue-bg:#1b2847; --red:#f19a92; --red-bg:#3e1a17;
  --violet:#bca7f0; --violet-bg:#2b2245; --cyan:#7fd2df; --cyan-bg:#12343a; --green:#8fd59d; --green-bg:#173521; --grey:#9aa6a0; --grey-bg:#252c29;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{font:700 20px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--amber-bg);color:var(--amber);font:500 11px/18px var(--f-mono);text-align:center}
.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.who img{width:22px;height:22px;border-radius:50%}
main{max-width:1320px;margin:0 auto;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--green-bg);color:var(--green);border-color:transparent}
.btn.no{background:var(--red-bg);color:var(--red);border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:14px;font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.fun-inline{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;min-width:0}.fun-inline>span+span::before{content:'· ';color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--grey-bg);color:var(--grey)}
.c-amber{background:var(--amber-bg);color:var(--amber)} .c-blue{background:var(--blue-bg);color:var(--blue)} .c-red{background:var(--red-bg);color:var(--red)}
.c-violet{background:var(--violet-bg);color:var(--violet)} .c-cyan{background:var(--cyan-bg);color:var(--cyan)} .c-green{background:var(--green-bg);color:var(--green)} .c-acc{background:var(--accent-soft);color:var(--accent)}
.plat{display:inline-flex;gap:4px;align-items:center;font:500 11px/1 var(--f-mono);color:var(--muted)}
.plat b{font-weight:600;color:var(--ink)}
.kname{font-weight:600}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.empty{padding:28px;text-align:center;color:var(--muted)}
.warn{border:1px solid var(--red);background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:6px;font-size:13px}
.note{border:1px solid var(--line);background:var(--soft);padding:10px 12px;border-radius:6px;font-size:13px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.flow>div{background:var(--panel);padding:12px}
.flow .n{font:500 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.flow .l{font-size:12px;color:var(--muted);margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ccard{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.ccard:hover{border-color:var(--muted)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--soft)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 0}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.12)}
.dhead{padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dbody{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:16px;flex:1}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:0}
.hist>div{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist>div:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.confirm{border:1px solid var(--amber);background:var(--amber-bg);padding:10px 12px;border-radius:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:11px;padding:3px 7px;border-radius:4px;background:var(--soft);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.err{color:var(--red);font-size:12px}
pre.brief{white-space:pre-wrap;font:13px/1.55 var(--f-body);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.dupe{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.flow>button{background:var(--panel);padding:12px;border:0;text-align:left;cursor:pointer}
.flow>button:hover{background:var(--soft)}
.flow>button[aria-pressed="true"]{background:var(--accent-soft)}
.flow .n.late{color:var(--red)}
.late{color:var(--red);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;font-size:13px}
.prog .bar{flex:1;min-width:80px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
/* background tints: soft pink / soft blue (light + dark) */
/* pink = Selfie Time brand pink (from campaign posters); always light, also when the device is in dark mode */
:root[data-tint="pink"]{--bg:#fdeaf3;--panel:#ffffff;--ink:#2a1720;--muted:#7a5566;--line:#f2c6da;--soft:#fbdeeb;--accent:#c23a8f;--accent-ink:#ffffff;--accent-soft:#fcd3e6;--side:#f7bcd7;--side-active:#ffffff;--amber:#a15c00;--amber-bg:#fdf0d8;--blue:#1f4fa8;--blue-bg:#e2eafb;--red:#b3261e;--red-bg:#fbe3e1;--violet:#5b3fa3;--violet-bg:#ece6fa;--cyan:#0b6475;--cyan-bg:#dcf1f4;--green:#1d6b2f;--green-bg:#dff1e2;--grey:#7a5566;--grey-bg:#f6e6ee;color-scheme:light}
header.top{background:var(--side,var(--panel))}
nav.tabs button[aria-current="true"]{background:var(--side-active,var(--accent-soft))}
:root[data-tint="blue"]{--bg:#edf3fb;--soft:#e0eaf6;--line:#d0deee;--accent:#245aa3;--accent-soft:#dbe7f8;--muted:#566476}
@media (prefers-color-scheme: dark){
  :root[data-tint="pink"]:not([data-theme="light"]){--bg:#fdeaf3;--panel:#ffffff;--ink:#2a1720;--muted:#7a5566;--line:#f2c6da;--soft:#fbdeeb;--accent:#c23a8f;--accent-ink:#ffffff;--accent-soft:#fcd3e6;--side:#f7bcd7;--side-active:#ffffff;--amber:#a15c00;--amber-bg:#fdf0d8;--blue:#1f4fa8;--blue-bg:#e2eafb;--red:#b3261e;--red-bg:#fbe3e1;--violet:#5b3fa3;--violet-bg:#ece6fa;--cyan:#0b6475;--cyan-bg:#dcf1f4;--green:#1d6b2f;--green-bg:#dff1e2;--grey:#7a5566;--grey-bg:#f6e6ee;color-scheme:light}
  :root[data-tint="blue"]:not([data-theme="light"]){--bg:#121820;--panel:#18202a;--soft:#1f2935;--line:#2a3646;--accent:#8db6f2;--accent-ink:#0b1a30;--accent-soft:#1d3150;--muted:#9aa9bb}}
:root[data-theme="dark"][data-tint="pink"]{--bg:#fdeaf3;--panel:#ffffff;--ink:#2a1720;--muted:#7a5566;--line:#f2c6da;--soft:#fbdeeb;--accent:#c23a8f;--accent-ink:#ffffff;--accent-soft:#fcd3e6;--side:#f7bcd7;--side-active:#ffffff;--amber:#a15c00;--amber-bg:#fdf0d8;--blue:#1f4fa8;--blue-bg:#e2eafb;--red:#b3261e;--red-bg:#fbe3e1;--violet:#5b3fa3;--violet-bg:#ece6fa;--cyan:#0b6475;--cyan-bg:#dcf1f4;--green:#1d6b2f;--green-bg:#dff1e2;--grey:#7a5566;--grey-bg:#f6e6ee;color-scheme:light}
:root[data-theme="dark"][data-tint="blue"]{--bg:#121820;--panel:#18202a;--soft:#1f2935;--line:#2a3646;--accent:#8db6f2;--accent-ink:#0b1a30;--accent-soft:#1d3150;--muted:#9aa9bb}
.tint{display:flex;gap:6px;align-items:center}
.tint button{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.tint button[aria-pressed="true"]{border-color:var(--ink)}
.tint button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button{display:inline-flex;align-items:center;gap:8px}
nav.tabs .lbl{flex:1;text-align:left;min-width:0;white-space:normal}
nav.tabs .badge{flex:none}
.side-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.side-foot .lbl-sm{font:600 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dlbtn{display:inline-flex;align-items:center;gap:8px}
@media (max-width:899px){
  header.top .topin{gap:10px}
  nav.tabs{order:3;flex-basis:100%}
  .side-foot{margin-left:auto;gap:10px}
  .side-foot .lbl-sm,.side-foot .who{display:none}
  .dlbtn{padding:6px 9px;font-size:12px}
}
@media (min-width:900px){
  header.top{position:fixed;top:0;left:0;bottom:0;width:236px;border-bottom:0;border-right:1px solid var(--line);
    padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
  header.top .topin{flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:22px;height:100%;max-width:none;padding-block:0;margin:0}
  .brand{flex-direction:column;align-items:flex-start;gap:6px;padding:0 10px;font-size:22px}
  nav.tabs{flex-direction:column;flex:0 0 auto;overflow:visible;gap:2px}
  nav.tabs button{width:100%;padding:9px 10px;border-radius:7px}
  nav.tabs button:hover{background:var(--soft);color:var(--ink)}
  nav.tabs button[aria-current="true"]:hover{background:var(--accent-soft);color:var(--accent)}
  .side-foot{margin-top:auto;flex-direction:column;align-items:stretch;gap:14px;padding:14px 10px 0;border-top:1px solid var(--line)}
  .side-foot .who{order:3}
  .dlbtn{justify-content:center}
  main.wrap{margin-left:236px;margin-right:0;max-width:none;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  main.wrap>*{max-width:1280px}
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;color:inherit}
button.stat{cursor:pointer}button.stat:hover{border-color:var(--muted)}
.stat .n{font:500 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.stat.warn-n .n{color:var(--amber)}.stat.late-n .n{color:var(--red)}
.stat.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
nav.tabs .badge.late{background:var(--red-bg);color:var(--red)}
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 44px 44px;gap:10px;align-items:center;font-size:13px}
.funnel.compact .frow{grid-template-columns:130px minmax(0,1fr) 40px 40px}
.fl{color:var(--muted)}
.fbar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.fbar span{display:block;height:100%;background:var(--accent);border-radius:5px}
.fn{text-align:right}.fp{text-align:right;color:var(--muted)}
@media (max-width:520px){.frow,.funnel.compact .frow{grid-template-columns:96px minmax(0,1fr) 34px 38px;font-size:12px}}
.kendala{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--panel)}
.kendala summary{cursor:pointer;font-size:13px;color:var(--muted)}
.kendala[open] summary{margin-bottom:8px}
.cf-btn{border:0;background:transparent;color:inherit;opacity:.45;cursor:pointer;padding:0 0 0 4px;font-size:11px;line-height:1;vertical-align:middle}
th:hover .cf-btn,.cf-btn.on{opacity:1}.cf-btn.on{color:var(--accent)}
.cf-pop{position:absolute;z-index:80;background:var(--panel,#fff);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:10px;width:240px;max-height:340px;display:flex;flex-direction:column;gap:8px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400}
.cf-pop .cf-list{overflow:auto;display:flex;flex-direction:column;gap:4px;max-height:220px}
.cf-pop label{display:flex;gap:6px;align-items:center;cursor:pointer}
.cf-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin:0 0 8px}
.cf-bar .chip{cursor:pointer}

// nilai deal = fee + nilai produk. Jalur dikunci (d.rt) saat keputusan akhir supaya edit fee sesudahnya tidak mengubah status.
const ST_BRAND='Selfie Time',ST_LIMIT=1000000;

const ROUTE_TXT={st1:'Selfie Time ≤ Rp1 jt: '+A1+' saja',st2:'Selfie Time > Rp1 jt: '+A1+' → '+AS+' → '+A2,oth:'Brand lain: '+A1+' → '+A2};

function routeLive(d,c){c=c||DCAMP.get(d);if(!c||c.brand!==ST_BRAND)return'oth';return accValue(d,c)<=ST_LIMIT?'st1':'st2'}
function routeKey(d,c){return ROUTES[d.rt]?d.rt:routeLive(d,c)}
// deal yang lolos jalur "cukup Koord" lalu nilainya naik lewat Rp1 jt (barang ditambah / fee diubah) wajib ACC ulang dari Koord
function reaccPatch(c,d,patch){if(!c||!d||d.mig||d.a1!=='A'||routeKey(d,c)!=='st1')return null;

  const s=dealStatus(d),p={st:'Diajukan',rt:null,rst:sIdx(s)>sIdx('Approved')?s:null,racc:'Nilai naik jadi '+fmtRp(accValue(nd,c))+' (sebelumnya '+fmtRp(accValue(d,c))+')'};
  for(const f of ['a1','as','a2'])for(const x of ['','n','by','t'])p[f+x]=null;
  p.log=[...(patch.log||d.log||[]),logEntry('ACC ulang',{v:p.racc})];return p}

// deal lama yang sudah ACC Koord + Asmen tanpa ACC SPV tetap dianggap approved
function isApproved(d,c){return (d.a1==='A'&&d.a2==='A')||!!d.mig||accRoute(d,c).every(l=>d[ACC_FLD[l]]==='A')}
function waitingFor(d,c){if(dealStatus(d)!=='Diajukan')return null;if(d.a1==='R'||d.as==='R'||d.a2==='R')return null;const r=accRoute(d,c);
  for(const l of r)if(d[ACC_FLD[l]]!=='A'&&!(l===AS&&d.a2==='A'))return l;

function dealMode(d,c){if(d&&DMODE[d.dm])return d.dm;const m=campMode(c);if(m==='ship')return d&&d.kirim===false?'visit':'ship';return d&&(d.kirim||d.item||d.resi)?'both':'visit'}

function lateInfo(d){const s=dealStatus(d),t=today();
  if(s==='Dihubungi'&&d.tk){const n=daysBetween(d.tk,t);if(n>NO_RESP_DAYS)return{late:true,txt:n+' hari belum respon'};return{txt:'Diundang '+fmtD(d.tk)}}
  if(s==='Diajukan'&&d.tdj){const n=daysBetween(d.tdj,t);return{txt:'Menunggu ACC '+(waitingFor(d)||'')+(n>0?' · '+n+' hari':'')}}
  if(s==='Terjadwal'){
    if(d.tdr&&!d.dlink&&daysBetween(d.tdr,t)>0)return{late:true,txt:'Draft telat '+daysBetween(d.tdr,t)+' hari'};

function funnel(deals){const f={inv:0,resp:0,deal:0,acc:0,datang:0,post:0};

        h('button',{class:'linkish',type:'button',onclick:()=>{for(const[v]of visible())chk.add(v);draw()}},'Pilih semua'),
        h('button',{class:'linkish',type:'button',onclick:()=>{for(const[v]of visible())chk.delete(v);draw()}},'Kosongkan')),list,more,
      h('div',{class:'row',style:'gap:6px'},h('button',{class:'btn sm pri',type:'button',onclick:apply},'Terapkan'),
        h('button',{class:'btn sm',type:'button',onclick:()=>{delete COLF[cfKey(lbl)];done()}},'Reset')));
    draw();setTimeout(()=>find.focus(),0)}
  pop.addEventListener('keydown',e=>{if(e.key==='Escape')cfClose()});
  document.body.append(pop);const r=th.getBoundingClientRect();const w=240;
  pop.style.left=Math.max(8,Math.min(r.left+window.scrollX,window.scrollX+document.documentElement.clientWidth-w-8))+'px';pop.style.top=(r.bottom+window.scrollY+4)+'px';
  setTimeout(()=>document.addEventListener('click',cfClose,{once:true}),0)}
function cfClose(){document.querySelectorAll('.cf-pop').forEach(p=>p.remove())}
function cfEnhance(tbl){if(tbl.dataset.nofilter||!tbl.tHead||!tbl.tHead.rows[0])return;const ths=[...tbl.tHead.rows[0].cells];
  for(const th of ths){if(th.dataset.lbl!=null)continue;const lbl=(th.textContent||'').trim();th.dataset.lbl=lbl;if(CF_SKIP.includes(lbl))continue;
    th.append(h('button',{class:'cf-btn',type:'button','aria-label':'Filter kolom '+lbl,title:'Filter kolom '+lbl,onclick:e=>{e.stopPropagation();cfOpen(th,tbl)}},'▾'))}
  cfApply(tbl)}
function cfAll(){cfClose();document.querySelectorAll('#main table').forEach(cfEnhance);document.querySelectorAll('#main table').forEach(t=>{if(!t.dataset.nofilter&&t.tHead)cfApply(t)})}
let cfT=null;function cfWatch(){const m=$('#main');if(!m||m._cf)return;m._cf=true;new MutationObserver(()=>{hsAll();clearTimeout(cfT);cfT=setTimeout(()=>{document.querySelectorAll('#main table').forEach(t=>{if(t.dataset.nofilter||!t.tHead)return;if(!t.tHead.rows[0].cells[0]||t.tHead.rows[0].cells[0].dataset.lbl==null)cfEnhance(t);else cfApply(t)})},30)}).observe(m,{childList:true,subtree:true})}
/* ---------- dropdown filter: langsung terbuka saat kursor diarahkan (gaya menu macOS / iOS) ---------- */
// <select> aslinya tetap ada (disembunyikan) sebagai sumber nilai, jadi onchange filter yang lama tetap jalan. Di HP / layar sentuh: tap untuk membuka.
const HS_HOVER=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches);
let hsOpen=null,hsCool=0;
function hsClose(){if(hsOpen){hsOpen.wrap.classList.remove('open');hsOpen.btn.setAttribute('aria-expanded','false');hsOpen=null}}
document.addEventListener('click',hsClose);document.addEventListener('keydown',e=>{if(e.key==='Escape')hsClose()});
function hsEnhance(s){if(s.dataset.hs)return;s.dataset.hs='1';
  const wrap=h('span',{class:'hsel'}),btn=h('button',{type:'button',class:'hsel-btn','aria-haspopup':'listbox','aria-expanded':'false'}),menu=h('div',{class:'hsel-menu',role:'listbox'});
  if(s.getAttribute('aria-label'))btn.setAttribute('aria-label',s.getAttribute('aria-label'));
  s.parentNode.insertBefore(wrap,s);wrap.append(s,btn,menu);s.tabIndex=-1;s.setAttribute('aria-hidden','true');
  const label=()=>{const o=s.options[s.selectedIndex];btn.replaceChildren(h('span',{class:'hsel-t'},o?o.text:''),svg('<path d="m6 9 6 6 6-6"/>'));btn.classList.toggle('on',s.selectedIndex>0&&s.options[0].value==='')};
  const pick=i=>{hsClose();hsCool=Date.now()+500;if(s.selectedIndex===i)return;s.selectedIndex=i;label();s.dispatchEvent(new Event('change',{bubbles:true}))};
  const build=()=>{menu.replaceChildren(...[...s.options].map((o,i)=>{const on=i===s.selectedIndex;
    return h('button',{type:'button',role:'option',class:'hsel-it'+(on?' sel':'')+(i===0&&o.value===''&&s.options.length>1?' first':''),'aria-selected':on?'true':'false',onclick:e=>{e.stopPropagation();pick(i)}},h('span',{class:'hsel-ck'},on?'✓':''),h('span',{},o.text))}))};
  const open=()=>{if(hsOpen&&hsOpen.wrap===wrap)return;hsClose();build();wrap.classList.add('open');btn.setAttribute('aria-expanded','true');hsOpen={wrap,btn};
    const r=wrap.getBoundingClientRect();menu.classList.toggle('right',r.left+Math.max(220,r.width)>document.documentElement.clientWidth-8);
    const cur=menu.querySelector('.sel');if(cur)menu.scrollTop=Math.max(0,cur.offsetTop-menu.clientHeight/2)};
  let t;
  if(HS_HOVER){wrap.addEventListener('mouseenter',()=>{clearTimeout(t);if(Date.now()<hsCool)return;t=setTimeout(open,40)});
    wrap.addEventListener('mouseleave',()=>{clearTimeout(t);t=setTimeout(()=>{if(hsOpen&&hsOpen.wrap===wrap)hsClose()},160)})}
  btn.addEventListener('click',e=>{e.stopPropagation();if(hsOpen&&hsOpen.wrap===wrap){if(!HS_HOVER)hsClose()}else open()});
  btn.addEventListener('keydown',e=>{if(['ArrowDown','Enter',' '].includes(e.key)){e.preventDefault();open();const f=menu.querySelector('.sel')||menu.firstChild;if(f)f.focus()}});
  menu.addEventListener('keydown',e=>{const its=[...menu.children];const i=its.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(its[i+1]||its[0]).focus()}else if(e.key==='ArrowUp'){e.preventDefault();(its[i-1]||its[its.length-1]).focus()}
    else if(e.key==='Escape'){e.stopPropagation();hsClose();btn.focus()}else if(e.key==='Tab')hsClose()});
  s.addEventListener('change',label);label()}
// hanya dropdown filter di halaman (bukan isian form, drawer, tabel, atau pengaturan)
function hsAll(){document.querySelectorAll('#main select:not([data-hs])').forEach(s=>{if(!s.closest('form,.drawer,.tablebox,label.f,.panel.pad'))hsEnhance(s)})}
async function boot(){
  applyLists(null);cfWatch();
  const archP=window.KD.loadArchive().catch(()=>{S.dbErr='Arsip KOL gagal dimuat. Muat ulang halaman.';return{kols:[]}});
  const capP=(async()=>{if(!window.claude||!window.claude.use)return;
    const [db,user,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);S.db=db;S.user=user;S.dl=dl;
    if(user){S.me=await user.me();S.canWrite=await user.can('data.write');if(S.canWrite===false)S.readOnly=true}})();
  const arch=await archP;for(const k of arch.kols)S.arch.set(k.id,k);
  await Promise.race([capP,new Promise(r=>setTimeout(r,11000))]);
  rebuildKols();S.loaded=true;render();
  if(!S.db){S.dbErr='Tidak tersambung ke server. Cek koneksi internet lalu muat ulang halaman.';render();return}
  const onErr=what=>e=>{S.dbErr='Koneksi '+what+' terputus ('+(e&&e.code)+'). Muat ulang halaman.';render()};
  S.db.collection('campaigns').where('archived','==',false).onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')S.camps.delete(ch.doc.id);else S.camps.set(ch.doc.id,Object.assign({id:ch.doc.id},ch.doc.data()))}scheduleRender()},onErr('campaign'));
  S.db.collection('kols').onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')S.over.delete(ch.doc.id);else S.over.set(ch.doc.id,ch.doc.data())}rebuildKols();scheduleRender()},onErr('data KOL'));
  const computeRole=()=>{const prev=S.myRole;S.myRole=S.me&&S.me.isOwner?'superadmin':roleOf(S.me&&S.me.id);S.rolesReady=true;
    if(!S.myRole&&S.me&&S.me.id&&!S.access.has(S.me.id)&&!S._asked){S._asked=true;S.db.doc('access/'+S.me.id).set({t:Date.now()}).catch(()=>{})}
    if(prev!==S.myRole)render();else scheduleRender()};
  S.db.collection('roles').onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')S.roles.delete(ch.doc.id);else S.roles.set(ch.doc.id,ch.doc.data())}computeRole()},e=>{S.rolesReady=true;S.dbErr='Data role tidak bisa dibaca ('+(e&&e.code)+').';render()});
  S.db.collection('access').onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')S.access.delete(ch.doc.id);else S.access.set(ch.doc.id,ch.doc.data())}if(S.rolesReady)scheduleRender()},()=>{});
  if(!S.me||!S.me.id){S.rolesReady=true;S.myRole=S.me&&S.me.isOwner?'superadmin':null;render()}
  S.db.collection('settings').onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==='brands');applyBrands(d&&d.data().list);const l=snap.docs.find(x=>x.id==='lists');applyLists(l&&l.data());const tg=snap.docs.find(x=>x.id==='targets');S.targets=tg?tg.data():null;const zn=snap.docs.find(x=>x.id==='zones');S.zones=zn?zn.data():null;const kp=snap.docs.find(x=>x.id==='kop');S.kop=kp?kp.data():null;const ins=snap.docs.find(x=>x.id==='insights');S.insights=ins?ins.data():null;scheduleRender()},()=>{});
  S.db.collection('requests').onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')S.reqs.delete(ch.doc.id);else S.reqs.set(ch.doc.id,Object.assign({id:ch.doc.id},ch.doc.data()))}scheduleRender()},onErr('request'));
}
window.KD_BOOT=boot;
})();
