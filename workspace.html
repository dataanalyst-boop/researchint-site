<style>
[hidden]{display:none!important}
body{margin:0}

/* Layout: sidebar navy (brand HnS) + workspace Board/List/Kalender + drawer detail task 2 kolom (properti | aktivitas) */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface2:#eceef4; --line:#dde1ea; --line2:#c9cfdc;
  --fg:#161b2e; --muted:#626a80;
  --navy:#1d3a8f; --navy-ink:#ffffff; --navy-soft:#e4eaf8;
  --brand:#1c5fa8; --brand-soft:#e3edf8; --brand-ink:#ffffff; --orange:#ef8a17;
  --danger:#b42318; --danger-soft:#fbe6e3; --ok:#1f7a4c;
  --side-bg:#12204b; --side-fg:#d9def0; --side-muted:#8e98bd; --side-hover:#1c2c62; --side-on:#24387a;
  --s-todo:#66789e; --s-wip:#2f6fd0; --s-not:#8a8f9c; --s-qmr:#b4690e; --s-hold:#c0392b; --s-plan:#7a5aa6; --s-cancel:#7d7d86; --s-done:#1f7a4c;
  --p-urg:#d92d2d; --p-high:#d9730d; --p-norm:#3b6fd8; --p-low:#8a91a3;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --shadow:0 18px 50px rgba(18,32,75,.22); --shadow-sm:0 1px 2px rgba(18,32,75,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#161a2b; --surface2:#1e2337; --line:#2a3048; --line2:#3a4262;
  --fg:#e7eaf3; --muted:#9aa1b8; --navy:#8aa5f7; --navy-ink:#0b1230; --navy-soft:#1f2b55;
  --brand:#5aa2ec; --brand-soft:#17304f; --brand-ink:#08172b; --orange:#ffa64d; --danger:#ff7a70; --danger-soft:#3a1c1b; --ok:#5cc489;
  --side-bg:#0a0f22; --side-fg:#d9def0; --side-muted:#7f89ae; --side-hover:#151d3d; --side-on:#1f2b5a;
  --s-todo:#93a2c4; --s-wip:#6ea3f2; --s-not:#a4a9b2; --s-qmr:#e0a24f; --s-hold:#ee8a7c; --s-plan:#b79be0; --s-cancel:#a0a0a8; --s-done:#5cc489;
  --p-urg:#ff6b6b; --p-high:#f0a04b; --p-norm:#7aa2f7; --p-low:#9aa1b4;
  --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2b; --surface2:#1e2337; --line:#2a3048; --line2:#3a4262;
  --fg:#e7eaf3; --muted:#9aa1b8; --navy:#8aa5f7; --navy-ink:#0b1230; --navy-soft:#1f2b55;
  --brand:#5aa2ec; --brand-soft:#17304f; --brand-ink:#08172b; --orange:#ffa64d; --danger:#ff7a70; --danger-soft:#3a1c1b; --ok:#5cc489;
  --side-bg:#0a0f22; --side-fg:#d9def0; --side-muted:#7f89ae; --side-hover:#151d3d; --side-on:#1f2b5a;
  --s-todo:#93a2c4; --s-wip:#6ea3f2; --s-not:#a4a9b2; --s-qmr:#e0a24f; --s-hold:#ee8a7c; --s-plan:#b79be0; --s-cancel:#a0a0a8; --s-done:#5cc489;
  --p-urg:#ff6b6b; --p-high:#f0a04b; --p-norm:#7aa2f7; --p-low:#9aa1b4;
  --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
td.num{white-space:nowrap}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.01em;white-space:nowrap}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
/* ---------- sidebar ---------- */
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;min-height:0;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand .lg{background:#fff;border-radius:9px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.brand .lg img{width:27px}
.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;color:#fff}
.brand small{color:var(--side-muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.find{margin:2px 12px 8px;display:flex;align-items:center;gap:8px;background:var(--side-hover);border:1px solid #ffffff14;color:var(--side-muted);border-radius:8px;padding:7px 10px;text-align:left}
.find span{flex:1}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.75}
.nav{padding:4px 8px;overflow:auto;flex:1;min-height:0}
.nav h6{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);font-weight:700}
.nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:7px;padding:7px 10px;text-align:left;min-width:0;color:var(--side-fg)}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-on);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #f28c1b}
.nav .sub-nav{padding-left:30px;font-size:13.5px;color:var(--side-muted)}
.nav .sub-nav.on{color:#fff}
.nav .addf{opacity:.75}
.addfold{padding:4px 8px 4px 30px}.addfold input{background:var(--side-hover);border:1px solid #ffffff2a;color:var(--side-fg);border-radius:7px;padding:5px 8px;width:100%;font-size:13px}
.nav .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .sq{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none}
.badge{background:#ff5b60;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;min-width:19px;text-align:center;line-height:19px}
.nav .cnt{color:var(--side-muted)}
.cnt{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.foot{border-top:1px solid #ffffff14;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.foot label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);font-weight:700}
.foot select{background:var(--side-hover);border:1px solid #ffffff1f;color:var(--side-fg);border-radius:7px;padding:6px 8px;width:100%}
.foot select option{color:#161b2e;background:#fff}
.rolenote{font-size:11.5px;color:var(--side-muted);line-height:1.4}
.foot .row{display:flex;gap:6px}
.sbtn{flex:1;background:none;border:1px solid #ffffff24;color:var(--side-fg);border-radius:7px;padding:5px 8px;font-size:12px}
.sbtn:hover{background:var(--side-hover)}
/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.top h1{font-size:20px;font-weight:800;margin:0;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.sp{flex:1}
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 12px 8px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--orange)}
.tb{display:flex;gap:8px;align-items:center;padding:10px 20px;flex-wrap:wrap}
select,input[type=text],input[type=date],input[type=time],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
select:disabled,input:disabled,textarea:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.tb select{width:auto}
.srch{position:relative;width:210px;max-width:100%}
.srch input{padding-left:28px}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-weight:600;font-size:13px}
.tog.on{background:var(--navy-soft);color:var(--navy);border-color:transparent}
.link{background:none;border:0;color:var(--navy);font-weight:600;font-size:13px;padding:4px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:7px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}
.btn.nv{background:var(--navy);color:var(--navy-ink)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.notulen{margin:0 20px 2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;display:flex;gap:26px;flex-wrap:wrap;font-size:13px}
.notulen div{min-width:0}
.lbl{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.warnbar{margin:0 20px;background:var(--navy-soft);color:var(--navy);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500}
.content{flex:1;min-height:0;overflow:auto;padding:12px 20px 24px}
/* chips, pills, avatar */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{white-space:nowrap;font-size:11px;border-radius:5px;padding:1px 7px;background:var(--surface2);color:var(--muted);font-weight:600;border:0;line-height:18px}
.chip.carry{background:var(--navy-soft);color:var(--navy)}
.tag{font-size:11px;border-radius:99px;padding:0 8px;font-weight:600;line-height:19px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);white-space:nowrap;letter-spacing:.02em}
.pill i,.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--c);font-weight:600}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.ic{display:inline-flex;align-items:center;gap:3px}
.late{color:var(--danger);font-weight:700}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 6px}
/* ---------- board ---------- */
.board{display:flex;gap:12px;align-items:flex-start;min-height:100%}
.col{flex:0 0 272px;background:var(--surface2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col.over{outline:2px dashed var(--navy)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.colh .pill{font-size:10.5px}
.colh .add{margin-left:auto;background:none;border:0;color:var(--muted);border-radius:6px;width:24px;height:24px;font-size:17px;line-height:1}
.colh .add:hover{background:var(--surface);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow-sm)}
.card:hover{border-color:var(--line2)}
.card.od{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.card .hd{display:flex;align-items:center;gap:6px;color:var(--muted)}
.card .ti{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.meta .due{font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.bar{flex:1;height:4px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.qa{display:flex;flex-direction:column;gap:6px}
.pline,.psub{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);min-width:0}
.pline{margin-bottom:-4px}
.psub{font-weight:500;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--navy-ink)}
.tcell{display:flex;align-items:center;gap:8px;min-width:0}
.tcell .tt{overflow-wrap:anywhere}
.wkt td{padding-top:7px;padding-bottom:7px}.wkt tr.wpar td{background:var(--surface)}.wkt tr.wpar .tt{font-weight:700;letter-spacing:.01em}
.wkt tr.kid td{background:var(--surface)}
.wph{color:var(--line2);display:inline-grid;place-items:center}.wph svg{width:15px;height:15px}
.avs{display:inline-flex;align-items:center}.avs .av{box-shadow:0 0 0 2px var(--surface)}.avs .av+.av{margin-left:-5px}.av.more{background:var(--surface2);color:var(--muted)}
select.wst{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 12%,var(--surface));font-weight:600;font-size:12px}
tr.wadd td{padding:2px 8px 6px;background:var(--surface)}.wadf{display:flex;align-items:center;gap:8px;color:var(--muted)}
.wadf input{border:0;background:none;padding:6px 4px;font:inherit;font-size:13px;color:var(--ink);flex:1;min-width:0}.wadf input:focus{outline:2px solid var(--focus,#2f6fd0);outline-offset:1px;border-radius:6px}
.tcar{width:20px;height:20px;flex:none;display:inline-grid;place-items:center;background:none;border:0;border-radius:5px;color:var(--muted);padding:0}
button.tcar:hover{background:var(--surface2)}
.tcar svg{transition:transform .15s}.tcar.shut svg{transform:rotate(-90deg)}
tr.par td.ti{font-weight:700}
tr.kid td.ti{font-weight:500}
tr.kid td{background:color-mix(in srgb,var(--surface2) 35%,var(--surface))}
.krow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500}

.dl{padding:16px 20px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dr{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ttl{font-size:22px;font-weight:800;letter-spacing:-.015em;border:1px solid transparent;background:transparent;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px)}
.ttl:not(:disabled):hover{border-color:var(--line)}
.ttl:disabled{background:transparent;color:var(--fg);cursor:default}
.fg{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;align-items:center}
.fg>label,.fg>.k{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.fg .ro{padding:6px 0}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer .num{font-family:var(--mono);font-size:13px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-weight:700;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.tbtn.run{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.tagin{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tagin .tag button{background:none;border:0;color:inherit;padding:0 0 0 4px;font-weight:700}
.tagin input{width:120px;padding:3px 7px;font-size:12px}
textarea{resize:vertical;min-height:80px}
.sec{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
.subs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sub{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sub:last-child{border-bottom:0}
.sub input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok);flex:none}
.sub.dn .kt{text-decoration:line-through;color:var(--muted)}
.sub .kt{flex:1;min-width:0;overflow-wrap:anywhere}
.sub .rm{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.addsub{display:flex;gap:6px;margin-top:6px}
.att{display:flex;flex-direction:column;gap:6px}
.gcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-decoration:none;color:inherit;min-width:0}
.gcard .gi{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.gcard .gt{min-width:0}.gcard .gt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.gcard .gt small{color:var(--muted)}
.ftabs{display:flex;gap:4px;padding:10px 14px 0}
.ftabs button{background:none;border:0;border-radius:6px;padding:4px 10px;font-weight:600;color:var(--muted);font-size:12.5px}
.ftabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.feed{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;min-height:160px}
.fe{display:flex;gap:9px}
.fe .bd{min-width:0;flex:1}
.fe .who{font-weight:700;font-size:13px}.fe .tm{color:var(--muted);font-size:11.5px;margin-left:6px}
.fe .tx{background:var(--surface);border:1px solid var(--line);border-radius:4px 10px 10px 10px;padding:8px 10px;margin-top:3px;overflow-wrap:anywhere}
.fe.h{font-size:12.5px;color:var(--muted);align-items:center}
.fe.h .hl{width:28px;display:flex;justify-content:center;flex:none}.fe.h .hl i{width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--line2)}
.fe.h b{color:var(--fg);font-weight:600}
.fe.h s{opacity:.7}
.mention{color:var(--navy);font-weight:700;background:var(--navy-soft);border-radius:4px;padding:0 3px}
.compose{border-top:1px solid var(--line);padding:10px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;position:relative}
.compose textarea{min-height:58px}
.compose .row{display:flex;gap:8px;align-items:center}
.msug{position:absolute;bottom:100%;left:14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);min-width:220px;padding:4px;z-index:5}
.msug button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;padding:6px 8px;border-radius:6px;text-align:left}
.msug button:hover,.msug button.on{background:var(--surface2)}
.hint{font-size:11.5px;color:var(--muted)}
/* ---------- modal & palette ---------- */
.mwrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:max(60px,env(safe-area-inset-top,0px)) 16px 16px;background:rgba(8,12,28,.45)}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:16px;font-weight:800}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.bigin{font-size:18px;font-weight:700;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0;background:transparent}
.pal{width:min(600px,100%)}
.pal .pin{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pal .pin input{border:0;font-size:16px;padding:4px 0;background:transparent}
.pal .pin input:focus-visible{outline:0}
.pres{max-height:380px;overflow:auto;padding:6px}
.pres h6{margin:8px 10px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pres button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px 10px;border-radius:7px;text-align:left}
.pres button.on{background:var(--navy-soft)}
.pres button .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:40;font-weight:600;max-width:calc(100% - 32px)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:25;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .side.open{transform:none}
  .menu{display:inline-block}
  .top,.tb,.content,.tabs{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .notulen,.warnbar{margin-left:16px;margin-right:16px}
  .dbody{display:block;overflow:auto}
  .dl{overflow:visible}.dr{border-left:0;border-top:1px solid var(--line)}.feed{overflow:visible}
  .col{flex-basis:258px}
  .cell{min-height:72px}.ev span{display:none}.ev{width:auto;padding:3px}
  .wl{grid-template-columns:110px minmax(0,1fr) 30px}
  .f2{grid-template-columns:minmax(0,1fr)}
  .srch{width:100%}
}
@media (prefers-reduced-motion:reduce){.side,.grph .car,.tcar svg{transition:none}}


/* layar masuk */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;background:var(--bg);overflow:auto}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow-sm)}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand img{width:40px;height:40px;border-radius:10px;background:var(--side-bg);padding:6px}
.auth-brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.auth-brand small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:2px}
.auth-body{display:flex;flex-direction:column;gap:14px}
.auth-body h1{font-size:20px;margin:0;letter-spacing:-.01em}
.auth-body .asub{margin:0;color:var(--muted);font-size:13.5px}
.auth-body code{font-family:var(--mono);font-size:12px}
.astack{display:flex;flex-direction:column;gap:12px}
.af{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.af input{font:inherit;font-size:14px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:10px 12px}
.af input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.abtn{font:inherit;font-weight:700;font-size:14px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:9px;padding:11px 14px;cursor:pointer}
.abtn:disabled{opacity:.6;cursor:progress}
.alink{font:inherit;font-size:13px;background:none;border:0;color:var(--brand);padding:4px 0;cursor:pointer;font-weight:600}
.arow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.err{color:var(--danger);font-size:13px;min-height:0}.err:empty{display:none}
.anote{background:var(--brand-soft);color:var(--fg);border-radius:9px;padding:10px 12px;font-size:13px}
.foot .who{display:flex;align-items:center;gap:10px;color:var(--side-fg);min-width:0}
.foot .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .who small{display:block;font-size:11.5px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

</style>
</head>
